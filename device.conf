# devices/fajita/device.conf: what this device repository is (hakios-xnu-kernel's docs/porting/repositories.md has every word).
# The status is what was seen on a OnePlus 6T (fajita) running the Darwin 16.5 user space, November 2026.

device fajita
	title       OnePlus 6T
	vendor      OnePlus
	soc         sdm845
	defconfig   fajita_defconfig
	maintainer  kiwiiiii-eth (README.md)
	status      display     works     the panel through the boot loader's framebuffer; frames drawn by the GPU (CONFIG_GPU, ca_vbl), up to 60 a second; brightness from Settings and Control Center (CONFIG_HAKIOS_DSIBL: DSI command mode, Samsung s6e3fc2x01)
	status      touch       works     Synaptics S3706B, RMI4 over I2C12 (CONFIG_HAKIOS_RMI4); the controller's charger bit follows USB, or touch drowns in USB noise
	status      buttons     works     power (PM8998 PON), volume up (GPIO6) and down (GPIO5) (CONFIG_HAKIOS_BUTTONS)
	status      cpu         works     all 8 cores, OSM frequency tables (1766 / 2649 MHz), a load governor (cpufreq_gov=1)
	status      gpu         works     Adreno 630 brought up from cold (GMU, RSCC/PDC, zap shader through TrustZone; CONFIG_HAKIOS_A630), OpenGL ES 3.2 through Mesa freedreno (gpu=1); Metal not yet
	status      storage     partial   UFS through the loader (CONFIG_HAKIOS_UFS); /private/var kept across reboots in a partition "darwin" cut from userdata (ufs_write=1 var_store=1, two slots, saved as a run ends, 50-60 s); the Beta's kit does not make the partition and runs with both off
	status      audio       works     the speaker works, on by default (CONFIG_ADSP8=217): the ADSP through TrustZone, APR/AFE/ADM/ASM, QUAT MI2S at 48 kHz, the TFA9894 amplifier in bypass over I2C by hand; Darwin's /dev/hakios-audio at its volume less 6 dB, limited to -20 dBFS; the microphone works too: the bottom one (AMIC4) through the WCD9340 codec and SLIMbus to the ADSP (AFE 0x4001, ASM session 2), /dev/hakios-mic, powered only while something records (Voice Memos; adsp8_mic=0: not)
	status      battery     works     PMI8998 fuel gauge: level, voltage, current, temperature in the status bar (CONFIG_HAKIOS_FG8998); charging under this kernel, 1 A in from USB
	status      haptic      works     PMI8998's LRA driver (CONFIG_HAKIOS_HAPTIC8998), on by default; stronger than an iPhone's, to be tuned
	status      camera      missing   not started (the flash LED is, below)
	status      torch       works     PMI8998 flash LED from Control Center's button (torch=3), 100 mA, 30 s at most (CONFIG_HAKIOS_TORCH8998)
	status      wifi        works     WCN3990 with Linux's ath10k (ISC) on LinuxKPI; the modem (MPSS, MBA-authenticated) started for its firmware; joined from Settings, WPA2-PSK, DHCP, Safari; a known network joined again by itself (auto-join: RSSI_BOUNDS answered, power-on taken before the radio is up); 5 GHz 80 MHz ~95-110 Mbps (wifi=1)
	status      bluetooth   partial   the WCN3990's Bluetooth half on GENI UART6 (CONFIG_HAKIOS_BT3990, bt=4): bluetoothd brings it up, scans, pairs with a Mac; a BLE keyboard pairs and types (BTLEServer, HID over GATT, CONFIG_HAKIOS_HIDRESOURCE); pairings are not kept across reboots
	status      cellular    works     LTE registered and data on FarEasTone (ipa8=11): IPA 3.5.1 (hakios.ipa.c), WDS, en1 with DHCP, Safari; 88 MB down, 56 MB up, no IPA errors; the status bar's 4G and bars are injected (no CommCenter)
	status      network     works     TCP/IP over Wi-Fi and over LTE (en1); Safari loads pages (mobileactivationd left out: it trapped and hung apsd, amsaccountsd and Safari behind it); sshd with a key (RC_JOBS=rc.jobs.ssh6t), neofetch at login
	status      location    partial   the modem's GPS through QMI LOC (gnss=1, CONFIG_GNSS), positions handed to locationd as simulated ones (gnssfeed), Location Services on; an outdoor fix not yet confirmed
	status      thermal     works     21 sensors (thermal_soc=845); GPU 596/257 MHz by load
	status      usb         partial   the loader's own USB (fastboot) to stage the system image and read the log; no USB in the kernel
